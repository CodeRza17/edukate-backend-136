<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{admin/layout}">
<head>
    <meta charset="UTF-8">
    <title>Category Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        .category-table {
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        .actions-header {
            min-width: 150px;
        }
        .action-buttons {
            display: flex;
            gap: 8px;
        }
        .btn-action {
            padding: 5px 12px;
            font-size: 0.875rem;
        }
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #6c757d;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid py-4">
        <div class="row mb-4">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center">
                    <h1 class="h3 mb-0">Category Management</h1>
                    <a th:href="@{/dashboard/category/create}" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> Add New Category
                    </a>
                </div>
                <p class="text-muted">Manage your product categories here</p>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card category-table">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                <tr>
                                    <th scope="col" class="ps-4">#</th>
                                    <th scope="col">Category Name</th>
                                    <th scope="col" class="actions-header text-center">Actions</th>
                                </tr>
                                </thead>
                                <tbody>
                                <!-- Check if categories exist -->
                                <tr th:if="${#lists.isEmpty(categoryDashboardDtoList)}">
                                    <td colspan="3" class="text-center py-4">
                                        <div class="empty-state">
                                            <i class="bi bi-folder-x" style="font-size: 3rem;"></i>
                                            <h4 class="mt-3">No Categories Found</h4>
                                            <p class="text-muted">Start by adding your first category</p>
                                        </div>
                                    </td>
                                </tr>

                                <!-- Categories list -->
                                <tr th:each="category, iterStat : ${categoryDashboardDtoList}">
                                    <td class="ps-4" th:text="${iterStat.index + 1}">1</td>
                                    <td th:text="${category.name}">Category Name</td>
                                    <td>
                                        <div class="action-buttons justify-content-center">
                                            <!-- Update button -->
                                            <a th:href="@{/dashboard/category/update/{id}(id=${category.id})}" class="btn btn-sm btn-outline-primary btn-action">
                                                <i class="bi bi-pencil-square"></i> Update
                                            </a>

                                            <!-- Delete button -->
                                            <a href="#" class="btn btn-sm btn-outline-danger btn-action">
                                                <i class="bi bi-trash"></i> Delete
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Info alert for actions -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="alert alert-info" role="alert">
                    <i class="bi bi-info-circle me-2"></i>
                    <strong>Note:</strong> Update and Delete actions will be implemented in the next phase. Currently, buttons are linked to "#".
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
